# Fork-only: build the Spoolman image from the scan-station branch and publish it to
# this fork's GitHub Container Registry, for pulling onto a home server (Unraid).
# Not part of the upstream contribution -- leave this file out of any PR to Donkie/Spoolman.

name: Fork image

on:
  push:
    branches:
      - scan-station
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build legacy client
        working-directory: client
        run: |
          npm ci
          rm -f .env && echo "VITE_APIURL=/api/v1" > .env.production
          npm run build

      - name: Build client_v2
        working-directory: client_v2
        run: |
          npm ci
          npm run build

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spoolman" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.1

      - name: Log in to the Github Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6.7.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          # The Dockerfile points this at upstream; pointing it at the fork links the
          # package to this repository on GHCR.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.name.outputs.image }}:scan-station
            ${{ steps.name.outputs.image }}:scan-station-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
